name: Fastlane Android Release & Auto-Signing

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Loại gói đóng gói (apk / aab / both)'
        required: true
        default: 'apk'
        type: choice
        options:
          - 'apk'
          - 'aab'
          - 'both'
      create_github_release:
        description: 'Tự động tạo GitHub Release đính kèm file đã ký số'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build & Sign Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: FE

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: FE/package-lock.json

      - name: ☕ Setup Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 💎 Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: FE

      - name: 📦 Install Fastlane via Bundler
        run: bundle install

      - name: 📦 Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔍 TypeScript Static Type Check
        run: npm run typecheck

      - name: 🛠️ Expo Prebuild (Generate native Android project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🚀 Run Fastlane Build & Sign Release APK
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: bundle exec fastlane android build_apk

      - name: 🚀 Run Fastlane Build & Sign Release AAB
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: bundle exec fastlane android build_aab

      - name: 📋 Diagnostics on Failure
        if: failure()
        run: |
          echo "=== PWD AND DIST ==="
          pwd
          ls -la dist/ 2>/dev/null || true
          echo "=== GRADLE LOGS ==="
          find android -name "*.log" -exec cat {} + 2>/dev/null || true
          echo "=== APP BUILD.GRADLE ==="
          cat android/app/build.gradle 2>/dev/null || true

      - name: 📊 Display Build Artifacts Summary
        run: |
          echo "### 📦 Danh sách gói phát hành đã ký số:" >> $GITHUB_STEP_SUMMARY
          echo "| Tên file | Kích thước | SHA256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in dist/*; do
            if [ -f "$f" ]; then
              fname=$(basename "$f")
              fsize=$(ls -lh "$f" | awk '{print $5}')
              fhash=$(sha256sum "$f" | awk '{print $1}')
              echo "| **$fname** | $fsize | \`$fhash\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: 📤 Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: hourlink-release-packages
          path: FE/dist/*
          retention-days: 30

      - name: 🏷️ Publish GitHub Release with Signed APK/AAB
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_github_release == 'true' || github.event.inputs.create_github_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          files: FE/dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
          name: "HourLink Mobile Release ${{ github.ref_name }}"
