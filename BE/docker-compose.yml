name: hourlink

services:
  mysql_db:
    image: mysql:8.0.40
    restart: unless-stopped
    container_name: hourlink_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hourlink_db
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    container_name: hourlink_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql_db
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hourlink_be
    platform: linux/amd64
    ports:
      - "8080:8080"
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      # Override url khi chạy trong Docker, trỏ tới container mysql_db:3306
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_db:3306/hourlink_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SIGNER_KEY: hourlink-super-secret-key-time-credit-exchange-platform-2024-very-long-for-hs512-64bytes
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    volumes:
      - hourlink_logs:/var/log/hourlink
      - hourlink_uploads:/app/uploads
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  db_data:
  hourlink_logs:
  hourlink_uploads:
