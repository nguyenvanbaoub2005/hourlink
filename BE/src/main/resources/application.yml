server:
  port: 8085
  servlet:
    context-path: /api

spring:
  config:
    import: optional:file:.env[.properties],optional:file:BE/.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3308/hourlink_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 20MB
      # Chừa phần multipart boundary/headers trong khi file vẫn bị giới hạn 20MB.
      max-request-size: 21MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# JWT Configuration (Nimbus JOSE — giống SCMS)
jwt:
  signerKey: ${JWT_SIGNER_KEY:hourlink-super-secret-key-time-credit-exchange-platform-2024-very-long-for-hs512-64bytes}
  valid-duration: 86400        # 1 ngày (giây)
  refreshable-duration: 604800 # 7 ngày (giây)

# Firebase (chat realtime — chức năng 9.10)
# Mặc định đọc từ classpath nên KHÔNG phụ thuộc thư mục chạy app:
#   đặt file service-account tại BE/src/main/resources/firebase-service-account.json
# Nếu chưa có file: chat vẫn chạy qua REST, chỉ mất realtime.
firebase:
  credentials: ${FIREBASE_CREDENTIALS:classpath:firebase-service-account.json}
  database-url: ${FIREBASE_DATABASE_URL:}

# Cloudinary
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
  api-key: ${CLOUDINARY_API_KEY:your_api_key}
  api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}

# Logging
logging:
  level:
    com.hourlink: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
